[project]
name = "camtrap-longtail-dino"
version = "0.1.0"
description = "Evaluating design decisions in long-tailed camera-trap species classification."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "kaggle>=1.7.4.5",
    "pillow>=12.2.0",
    "pytorch-lightning==2.4.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "scikit-learn==1.6.1",
    "xformers==0.0.28.post1",
    "wandb==0.19.10",
    "timm==1.0.15",
    "scipy==1.15.2",
    "numpy==2.2.5",
    "matplotlib>=3.10.1",
    "statsmodels",
    "wilds>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.2.0",
    "ruff>=0.11.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Notebook print/debug output lines run long naturally (formatted tables,
# LaTeX rows) - not worth wrapping for readability the way library code is.
"*.ipynb" = ["E501"]

[tool.ruff.format]
quote-style = "double"
